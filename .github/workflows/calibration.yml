# DESIGN.md §13 "calibration.yml": the nightly detector and merge-threshold gate on the real, pinned model.
#
# SKELETON. It runs only when started by hand, and it fails at the first step: the offline model tooling it runs has
# no home yet. The embedder codebase that held it (fetch-model, build-prototypes, calibration/run.ts) was retired
# when the app took over embedding (D1), and Functions never load the model again. It must never run on pull
# requests: it needs cloud credentials and the model mirror.
#
# TODO(M0) before enabling the triggers below:
#   - An offline tool (not a Functions codebase) that, with the pinned model from packages/core (EMBEDDING_MODEL,
#     onnxruntime-node and @huggingface/tokenizers, the versions the device runtime was verified against):
#       fetch-model: downloads the device files from gs://grouper-staging-models/models/eg2-q4-daa72c5/ and checks
#         each sha256 against EMBEDDING_MODEL.files, so the gate never downloads from Hugging Face;
#       build-prototypes: embeds prototypeTexts() and writes encodePrototypes() to prototypes.bin, which is uploaded
#         next to the model files (addInterests reads it there; app builds fetch it with sa-build@'s token and bundle it, F32);
#       calibrate: the gate below, plus the device golden vectors (DEVICE_GOLDEN_TOLERANCE).
#   - WIF pool and provider for this repository; a calibration service account with read access to
#     gs://grouper-staging-models only (DESIGN.md §9). No service-account keys.
#   - Repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_CALIBRATION_SERVICE_ACCOUNT.
# Then add:
#   schedule:
#     - cron: '41 2 * * *'
#   push:
#     branches: [main]
#     paths: ['packages/core/src/interests/**']
name: Calibration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # WIF

concurrency:
  group: calibration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  calibrate:
    name: Calibration gate (pinned model)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCS_MODEL_BUCKET: grouper-staging-models
    steps:
      - name: Require the offline model tooling and Workload Identity Federation
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_CALIBRATION_SERVICE_ACCOUNT }}
        run: |
          echo "::error::The offline model tooling (fetch-model, build-prototypes, calibrate) is not built yet (see the TODO at the top of this file)."
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_CALIBRATION_SERVICE_ACCOUNT first."
          fi
          exit 1
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CALIBRATION_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Fails if sensitive recall < 100 %, merge precision at the configured threshold < 0.93, false flags rise by
      # more than 5 points, or a device golden vector drifts beyond DEVICE_GOLDEN_TOLERANCE (DESIGN.md §13). The
      # labelled set is synthetic or founder-written, never user tags.
